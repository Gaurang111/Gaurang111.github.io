<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="JetBrains Mono, Consolas, monospace">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1f6e63" stroke-opacity=".35" stroke-width="1"/></pattern>
    <linearGradient id="mat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f3b36"/><stop offset="1" stop-color="#0a2622"/></linearGradient>
    <radialGradient id="v" cx=".5" cy=".45" r=".7"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".65"/></radialGradient>
  </defs>
  <rect width="1600" height="900" fill="#0b0d11"/>
  <rect x="120" y="90" width="1360" height="720" rx="18" fill="url(#mat)"/>
  <rect x="120" y="90" width="1360" height="720" rx="18" fill="url(#g)"/>
  <!-- board -->
  <g transform="translate(560 200)" stroke="#e9f3ef" stroke-width="10" stroke-linecap="round">
    <line x1="160" y1="0" x2="160" y2="480"/><line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="0" y1="160" x2="480" y2="160"/><line x1="0" y1="320" x2="480" y2="320"/>
  </g>
  <!-- pieces -->
  <g stroke-width="16" stroke-linecap="round" fill="none">
    <path d="M600 240l80 80M680 240l-80 80" stroke="#ff6b1a"/>
    <circle cx="800" cy="440" r="46" stroke="#3ee6c4"/>
    <path d="M920 560l80 80M1000 560l-80 80" stroke="#ff6b1a"/>
    <circle cx="960" cy="280" r="46" stroke="#3ee6c4"/>
  </g>
  <!-- target cell detection -->
  <g fill="none" stroke="#3ee6c4" stroke-width="4">
    <path d="M574 540v-24h24M706 516h24v24M730 660v24h-24M598 684h-24v-24"/>
  </g>
  <rect x="574" y="488" width="250" height="30" rx="4" fill="#3ee6c4"/>
  <text x="586" y="509" font-size="18" fill="#05110f" font-weight="700">target · bottom-left</text>
  <!-- gripper ghost path -->
  <path d="M1380 120 C 1200 300, 900 420, 652 600" fill="none" stroke="#ff6b1a" stroke-width="4" stroke-dasharray="4 14" stroke-linecap="round"/>
  <circle cx="652" cy="600" r="10" fill="#ff6b1a"/>
  <rect width="1600" height="900" fill="url(#v)"/>
  <!-- prompt -->
  <rect x="120" y="720" width="760" height="64" rx="10" fill="#0b0d11" fill-opacity=".85" stroke="#2a2f38"/>
  <text x="146" y="760" font-size="24" fill="#8d939e">&gt; <tspan fill="#ecebe6">"place the X piece in the bottom-left cell"</tspan></text>
  <text x="146" y="140" font-size="20" fill="#9fd9cf" letter-spacing="2">VLA · SMOLVLA · LEROBOT</text>
</svg>
